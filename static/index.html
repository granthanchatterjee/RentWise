<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentWise - Phase 4 and 5</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--mut:#6b7385;--brand:#0f766e;--bad:#b42318;--ok:#067647;--line:#e3e6ee}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--brand);color:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 14px 0 0}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{background:transparent;border:0;color:#fff;padding:6px 10px;cursor:pointer;font-size:14px;border-radius:6px}
nav button:hover,nav button.on{background:rgba(255,255,255,.22)}
main{max-width:1000px;margin:18px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:13px}
.price{font-size:18px;font-weight:600;color:var(--brand);margin:4px 0}
.badge{display:inline-block;background:#e6f4f1;color:var(--brand);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
.warn{background:#fff4e5;color:#92400e}.bad{background:#fde8e6;color:var(--bad)}
input,select,textarea,button{font:inherit}
input,select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;max-width:100%}
button{padding:7px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
button.red{color:var(--bad)}
.err{color:var(--bad)}.okm{color:var(--ok)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.modal[hidden]{display:none}
.box{background:#fff;border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto;position:relative}
.x{position:absolute;right:10px;top:8px;border:0;font-size:22px;background:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{text-align:center;padding:8px 0;border-radius:6px;font-size:13px;background:#e7f6ec}
.cal .h{background:none;color:var(--mut)}.cal .b{background:#fbd5d1}.cal .k{background:#dcdfe6}
.cal .me{cursor:pointer}
.ph{display:flex;gap:4px;margin:-14px -14px 10px;border-radius:10px 10px 0 0;overflow:hidden;background:#e7ebf0}
.ph img{flex:1;min-width:0;height:150px;object-fit:cover;cursor:pointer}
.ph.n1 img{height:190px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs span{position:relative}.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:6px;display:block}
.thumbs button{position:absolute;right:-5px;top:-7px;padding:0 5px;border-radius:50%;line-height:16px;font-size:12px;color:var(--bad)}
.contact{background:#e6f4f1;border:1px solid #b9ded8;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.sq{border-left:3px solid var(--brand);padding-left:10px;margin:8px 0}
</style>
</head>
<body>
<header><h1>RentWise</h1><nav id="nav"></nav></header>
<main id="main"></main>
<div class="modal" id="modal" hidden><div class="box"><button class="x" onclick="closeModal()">&times;</button><div id="mbody"></div></div></div>

<script>
let ME = null, VIEW = 'browse', FILT = {};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => $('#' + id).value;

async function api(path, method, body) {
  const r = await fetch(path, {method: method || 'GET', headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}
const money = f => '\u20B9' + Number(f.rent).toLocaleString('en-IN') + (f.kind === 'short' ? ' / night' : ' / month');
const stars = r => (r && r.n) ? '\u2605 ' + r.a.toFixed(1) + ' (' + r.n + ')' : 'No reviews yet';
const showModal = html => { $('#mbody').innerHTML = html; $('#modal').hidden = false; };
const closeModal = () => { $('#modal').hidden = true; };
const msg = (id, text, ok) => { $('#' + id).innerHTML = '<span class="' + (ok ? 'okm' : 'err') + '">' + esc(text) + '</span>'; };
const stBadge = s => ({verified:'<span class="badge">ID verified</span>', pending:'<span class="badge warn">ID under review</span>', rejected:'<span class="badge bad">ID rejected</span>'}[s] || '<span class="badge bad">ID not uploaded</span>');

function nav() {
  const t = [['browse', 'Browse flats']];
  if (!ME) t.push(['auth', 'Log in / Sign up']);
  else {
    t.push(['account', 'My account']);
    if (ME.role === 'owner') t.push(['myflats', 'My flats'], ['requests', 'Booking requests']);
    if (ME.role === 'tenant') t.push(['mybookings', 'My bookings'], ['squad', 'Flatmate squad']);
    if (ME.role === 'admin') t.push(['admin', 'Verify IDs and bills']);
  }
  $('#nav').innerHTML = t.map(x => '<button class="' + (VIEW === x[0] ? 'on' : '') + '" onclick="go(\'' + x[0] + '\')">' + x[1] + '</button>').join('') +
    (ME ? '<button onclick="logout()">Log out (' + esc(ME.name) + ')</button>' : '');
}
async function go(v) {
  VIEW = v; nav(); $('#main').innerHTML = 'Loading...';
  try { await VIEWS[v](); } catch (e) { $('#main').innerHTML = '<div class="card err">' + esc(e.message) + '</div>'; }
}
async function refreshMe() { ME = (await api('/api/me')).user; }
async function logout() { await api('/api/logout', 'POST'); ME = null; go('browse'); }

const VIEWS = {};

/* ---------- browse ---------- */
function flatCard(f) {
  return '<div class="card">' + photoStrip(f) + '<b>' + esc(f.title) + '</b><div class="mut">' + esc(f.area) + ', ' + esc(f.city) + ' \u00B7 ' + f.bedrooms + ' BHK \u00B7 ' + (f.kind === 'short' ? 'Short stay' : 'Long term') + '</div>' +
    '<div class="price">' + money(f) + '</div><p>' + esc(f.descr) + '</p>' +
    '<div><span class="badge">Verified owner</span><span class="badge">Electricity verified</span><span class="badge">No broker</span></div>' +
    '<div class="mut" style="margin:6px 0">Owner: ' + esc(f.owner_name) + ' \u00B7 ' + stars(f.owner_rating) + '</div>' +
    '<div class="row"><button onclick="showReviews(' + f.owner_id + ')">Owner reviews</button>' +
    (f.kind === 'short' ? '<button onclick="showCal(' + f.id + ',false)">Availability</button>' : '') +
    (ME && ME.role === 'tenant' ? '<button class="pri" onclick="reqForm(' + f.id + ',\'' + f.kind + '\')">' + (f.kind === 'short' ? 'Request booking' : 'Request to rent') + '</button>' : '') +
    '</div></div>';
}
VIEWS.browse = async () => {
  const qs = new URLSearchParams(Object.entries(FILT).filter(x => x[1])).toString();
  const flats = await api('/api/flats?' + qs);
  $('#main').innerHTML = '<div class="card row"><input id="fc" placeholder="City" value="' + esc(FILT.city || '') + '">' +
    '<select id="fk"><option value="">Long and short</option><option value="long"' + (FILT.kind === 'long' ? ' selected' : '') + '>Long term</option><option value="short"' + (FILT.kind === 'short' ? ' selected' : '') + '>Short stay</option></select>' +
    '<input id="fr" type="number" placeholder="Max rent" value="' + esc(FILT.max_rent || '') + '">' +
    '<input id="fb" type="number" placeholder="Min bedrooms" value="' + esc(FILT.bedrooms || '') + '">' +
    '<button class="pri" onclick="filt()">Search</button></div>' +
    '<div class="grid">' + (flats.map(flatCard).join('') || '<p>No flats found.</p>') + '</div>';
};
function filt() { FILT = {city: val('fc'), kind: val('fk'), max_rent: val('fr'), bedrooms: val('fb')}; go('browse'); }

async function showReviews(uid) {
  const r = await api('/api/reviews?user_id=' + uid);
  showModal('<h3>' + esc(r.user.name) + ' <span class="mut">(' + esc(r.user.role) + ')</span></h3><p>' + stars(r.rating) + '</p>' +
    (r.reviews.map(x => '<div class="sq"><b>\u2605 ' + x.rating + '</b> ' + esc(x.body) + '<div class="mut">' + esc(x.author) + ' \u00B7 ' + esc(x.created) + '</div></div>').join('') || '<p class="mut">No reviews yet.</p>'));
}
function reqForm(fid, kind) {
  showModal('<h3>' + (kind === 'short' ? 'Request a booking' : 'Request to rent') + '</h3>' +
    '<label>' + (kind === 'short' ? 'Check-in' : 'Move-in date') + '</label><input type="date" id="rs">' +
    (kind === 'short' ? '<label>Check-out</label><input type="date" id="re">' : '') +
    '<label>Message to the owner</label><textarea id="rn" rows="3" style="width:100%"></textarea>' +
    '<p><button class="pri" onclick="sendReq(' + fid + ',\'' + kind + '\')">Send request</button></p><div id="rm"></div>');
}
async function sendReq(fid, kind) {
  try {
    await api('/api/bookings', 'POST', {flat_id: fid, start_day: val('rs'), end_day: kind === 'short' ? val('re') : '', note: val('rn')});
    msg('rm', 'Request sent. The owner will see your profile and reviews before deciding.', true);
  } catch (e) { msg('rm', e.message); }
}

/* ---------- calendar ---------- */
let CAL = {fid: 0, own: false, month: ''};
async function showCal(fid, own, month) {
  const d = new Date(); CAL = {fid: fid, own: own, month: month || d.toISOString().slice(0, 7)};
  const c = await api('/api/flats/' + fid + '/calendar?month=' + CAL.month);
  const first = new Date(CAL.month + '-01T00:00:00'), days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const pad = (first.getDay() + 6) % 7;
  let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(x => '<div class="h">' + x + '</div>').join('') + '<div class="h"></div>'.repeat(pad);
  for (let i = 1; i <= days; i++) {
    const ds = CAL.month + '-' + String(i).padStart(2, '0');
    const cls = c.booked.includes(ds) ? 'b' : c.blocked.includes(ds) ? 'k' : 'f';
    const click = own && cls !== 'b' ? ' onclick="toggleDay(\'' + ds + '\',' + (cls === 'k') + ')"' : '';
    cells += '<div class="' + cls + (click ? ' me' : '') + '"' + click + '>' + i + '</div>';
  }
  const shift = n => { const x = new Date(first.getFullYear(), first.getMonth() + n, 1); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); };
  showModal('<h3>Availability</h3><div class="row"><button onclick="showCal(' + fid + ',' + own + ',\'' + shift(-1) + '\')">&lt;</button><b>' + CAL.month + '</b><button onclick="showCal(' + fid + ',' + own + ',\'' + shift(1) + '\')">&gt;</button></div>' +
    '<div class="cal">' + cells + '</div><p class="mut"><span class="badge">Green: free</span><span class="badge bad">Red: booked</span><span class="badge" style="background:#dcdfe6;color:#333">Grey: blocked by owner</span></p>' +
    (own ? '<p class="mut">Click a free day to block it, click a grey day to open it again.</p>' : ''));
}
async function toggleDay(day, isBlocked) {
  await api('/api/flats/' + CAL.fid + '/block', 'POST', {day: day, blocked: !isBlocked});
  showCal(CAL.fid, true, CAL.month);
}

/* ---------- auth + account ---------- */
VIEWS.auth = async () => {
  $('#main').innerHTML = '<div class="grid"><div class="card"><h3>Log in</h3><label>Email</label><input id="le"><label>Password</label><input id="lp" type="password">' +
    '<p><button class="pri" onclick="doLogin()">Log in</button></p><div id="lm"></div><p class="mut">Demo: owner@demo.com, neha@demo.com, aarav@demo.com (password demo123), admin@rentwise.local (admin123)</p></div>' +
    '<div class="card"><h3>Sign up</h3><label>I am a</label><select id="sr"><option value="tenant">Tenant</option><option value="owner">Owner</option></select>' +
    '<label>Full name (as on your ID proof)</label><input id="sn"><label>Email</label><input id="se"><label>Phone</label><input id="sp"><label>Password (6+ characters)</label><input id="sw" type="password">' +
    '<p><button class="pri" onclick="doSignup()">Create account</button></p><div id="sm"></div></div></div>';
};
async function doLogin() {
  try { await api('/api/login', 'POST', {email: val('le'), password: val('lp')}); await refreshMe(); go('account'); } catch (e) { msg('lm', e.message); }
}
async function doSignup() {
  try { await api('/api/signup', 'POST', {role: val('sr'), name: val('sn'), email: val('se'), phone: val('sp'), password: val('sw')}); await refreshMe(); go('account'); } catch (e) { msg('sm', e.message); }
}
VIEWS.account = async () => {
  await refreshMe();
  const u = ME;
  $('#main').innerHTML = '<div class="card"><h3>' + esc(u.name) + ' <span class="mut">(' + esc(u.role) + ')</span></h3><p>' + esc(u.email) + '</p><p>' + stBadge(u.id_status) + ' <span class="mut">' + stars(u.rating) + '</span></p></div>' +
    (u.role === 'admin' ? '' : '<div class="card"><h3>Identity verification</h3>' +
      '<p class="mut">Owners and tenants must upload an ID proof. The name on the ID must match your account name. Do not upload full Aadhaar numbers: use a masked copy, or PAN, passport or driving licence.</p>' +
      '<div class="two"><div><label>ID type</label><select id="it"><option>PAN</option><option>Passport</option><option>Driving licence</option><option>Aadhaar (masked copy)</option><option>Voter ID</option></select></div>' +
      '<div><label>Name printed on the ID</label><input id="in" value="' + esc(u.name) + '"></div></div>' +
      '<label>File (JPG, PNG or PDF, max 3 MB)</label><input type="file" id="if" accept=".jpg,.jpeg,.png,.pdf">' +
      '<p><button class="pri" onclick="sendId()">Submit for verification</button></p><div id="im"></div></div>');
};
async function sendId() {
  const f = $('#if').files[0];
  if (!f) return msg('im', 'Choose a file first');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
  try { await api('/api/me/id', 'POST', {id_type: val('it'), id_name: val('in'), filename: f.name, data: data}); go('account'); } catch (e) { msg('im', e.message); }
}
VIEWS.admin = async () => {
  const p = await api('/api/admin/pending');
  const bills = await api('/api/admin/bills');
  $('#main').innerHTML = '<h3>IDs waiting for verification</h3>' + (p.map(x => '<div class="card row"><div style="flex:1"><b>' + esc(x.name) + '</b> (' + esc(x.role) + ') ' + esc(x.email) +
    '<div class="mut">' + esc(x.id_type) + ' \u00B7 name on ID: ' + esc(x.id_name) + '</div></div><a href="/api/admin/idfile/' + x.id + '" target="_blank">View file</a>' +
    '<button class="pri" onclick="verify(' + x.id + ',true)">Approve</button><button class="red" onclick="verify(' + x.id + ',false)">Reject</button></div>').join('') || '<p class="mut">Nothing pending.</p>') +
    '<h3>Electricity bills waiting for verification</h3>' + (bills.map(x => '<div class="card row"><div style="flex:1"><b>' + esc(x.title) + '</b> (' + esc(x.city) + ')' +
    '<div class="mut">Owner account: ' + esc(x.owner_name) + ' (' + esc(x.owner_email) + ') \u00B7 name on bill: ' + esc(x.bill_name) + '</div>' +
    (x.other_owners > 0 ? '<div class="err">Warning: the same name on a bill is used by another owner.</div>' : '') + '</div>' +
    '<a href="/api/admin/billfile/' + x.id + '" target="_blank">View bill</a>' +
    '<button class="pri" onclick="verifyBill(' + x.id + ',true)">Approve</button><button class="red" onclick="verifyBill(' + x.id + ',false)">Reject</button></div>').join('') || '<p class="mut">Nothing pending.</p>');
};
async function verifyBill(id, ok) { await api('/api/admin/bill-verify', 'POST', {flat_id: id, approve: ok}); go('admin'); }
async function verify(id, ok) { await api('/api/admin/verify', 'POST', {user_id: id, approve: ok}); go('admin'); }

/* ---------- owner ---------- */
VIEWS.myflats = async () => {
  await refreshMe();
  const fl = await api('/api/flats/mine');
  const locked = ME.id_status !== 'verified';
  $('#main').innerHTML = '<div class="card"><h3>List a flat</h3>' + (locked ? '<p class="err">Your ID proof must be verified before you can list. ' + stBadge(ME.id_status) + '</p>' : '') +
    '<div class="two"><div><label>Title</label><input id="ft"></div><div><label>Type</label><select id="fk2"><option value="long">Long term (rent per month)</option><option value="short">Short stay (price per night)</option></select></div>' +
    '<div><label>City</label><input id="fci"></div><div><label>Area</label><input id="fa"></div>' +
    '<div><label>Bedrooms</label><input id="fbd" type="number" min="1"></div><div><label>Rent or price (\u20B9)</label><input id="frt" type="number"></div>' +
    '<div><label>Name printed on the electricity bill</label><input id=\"fbn\" value=\"' + esc(ME.name) + '\"></div>' +
    '<div><label>Electricity bill (JPG, PNG or PDF, max 3 MB)</label><input type=\"file\" id=\"fbf\" accept=\".jpg,.jpeg,.png,.pdf\"></div></div>' +
    '<label>Flat photos (optional, up to 3 JPG or PNG images)</label><input type="file" id="fph" accept=".jpg,.jpeg,.png" multiple>' +
    '<label>Description</label><textarea id="fd" rows="2" style="width:100%"></textarea>' +
    '<p class=\"mut\">Upload a recent electricity bill of this flat. Our admin checks that the name on the bill matches your account name, and the flat goes live after the bill is approved. Listings by agents or on someone else\'s connection are rejected.</p>' +
    '<p><button class="pri" onclick="addFlat()">Submit flat and bill for review</button></p><div id="fm"></div></div>' +
    '<h3>My flats</h3>' + (fl.map(f => '<div class="card row"><div style="flex:1"><b>' + esc(f.title) + '</b> ' + (f.active ? '' : '<span class="badge warn">Not listed</span>') +
      '<div class=\"mut\">' + esc(f.area) + ', ' + esc(f.city) + ' \u00B7 ' + f.bedrooms + ' BHK \u00B7 ' + money(f) + '</div><div>' + billBadge(f.bill_status) + '</div>' +
      '<div class="thumbs">' + f.photos.map(p => '<span><img src="' + esc(p) + '" alt=""><button title="Remove photo" onclick="rmPhoto(' + f.id + ',\'' + esc(p.split('/').pop()) + '\')">&times;</button></span>').join('') + '</div></div>' +
      (f.photos.length < 3 ? '<button onclick="photoForm(' + f.id + ',' + (3 - f.photos.length) + ')">Add photos</button>' : '') +
      (f.bill_status === 'rejected' ? '<button class=\"pri\" onclick=\"billForm(' + f.id + ')\">Upload bill again</button>' : '') +
      '<button onclick="editRent(' + f.id + ',' + f.rent + ')">Change price</button>' +
      '<button onclick="toggleActive(' + f.id + ',' + (f.active ? 0 : 1) + ')">' + (f.active ? 'Unlist' : 'List again') + '</button>' +
      (f.kind === 'short' ? '<button onclick="showCal(' + f.id + ',true)">Calendar</button>' : '') +
      '<button class="red" onclick="delFlat(' + f.id + ')">Delete</button></div>').join('') || '<p class="mut">No flats yet.</p>');
};
const billBadge = s => ({verified:'<span class="badge">Bill verified</span>', pending:'<span class="badge warn">Bill under review</span>', rejected:'<span class="badge bad">Bill rejected</span>'}[s] || '');
const photoStrip = f => (f.photos && f.photos.length) ? '<div class="ph n' + f.photos.length + '">' + f.photos.map(p => '<img src="' + esc(p) + '" alt="Flat photo" onclick="showPhoto(\'' + esc(p) + '\')">').join('') + '</div>' : '';
const showPhoto = p => showModal('<img src="' + esc(p) + '" style="width:100%;border-radius:8px" alt="Flat photo">');
const contactBox = (label, name, phone, email) => '<div class="contact"><b>' + label + ' contact details</b><br>' + esc(name) + '<br>Phone: ' + (phone ? '<a href="tel:' + esc(phone) + '">' + esc(phone) + '</a>' : '<span class="mut">not provided</span>') + '<br>Email: <a href="mailto:' + esc(email) + '">' + esc(email) + '</a></div>';
// resize to max 1200px JPEG so uploads stay small
const photoData = file => new Promise((res, rej) => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => { const k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url); res({filename: 'photo.jpg', data: c.toDataURL('image/jpeg', 0.82).split(',')[1]}); };
  img.onerror = () => rej(new Error('Could not read ' + file.name + '. Use JPG or PNG images'));
  img.src = url;
});
const readPhotos = async input => { const fs = [...input.files]; if (fs.length > 3) throw new Error('Choose at most 3 photos'); return Promise.all(fs.map(photoData)); };
const readFile = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
function billForm(fid) {
  showModal('<h3>Upload electricity bill</h3><label>Name printed on the bill</label><input id="rbn" value="' + esc(ME.name) + '">' +
    '<label>Bill (JPG, PNG or PDF, max 3 MB)</label><input type="file" id="rbf" accept=".jpg,.jpeg,.png,.pdf">' +
    '<p><button class="pri" onclick="sendBill(' + fid + ')">Submit for review</button></p><div id="rbm"></div>');
}
async function sendBill(fid) {
  const f = $('#rbf').files[0];
  if (!f) return msg('rbm', 'Choose a file first');
  try { await api('/api/flats/' + fid + '/bill', 'POST', {bill_name: val('rbn'), filename: f.name, data: await readFile(f)}); closeModal(); go('myflats'); } catch (e) { msg('rbm', e.message); }
}
async function addFlat() {
  const f = $('#fbf').files[0];
  if (!f) return msg('fm', 'Upload the electricity bill first');
  try {
    await api('/api/flats', 'POST', {title: val('ft'), kind: val('fk2'), city: val('fci'), area: val('fa'), bedrooms: val('fbd'), rent: val('frt'), bill_name: val('fbn'), filename: f.name, data: await readFile(f), descr: val('fd'), photos: await readPhotos($('#fph'))});
    go('myflats');
  } catch (e) { msg('fm', e.message); }
}
function photoForm(fid, left) {
  showModal('<h3>Add photos</h3><p class="mut">You can add ' + left + ' more (JPG or PNG).</p><input type="file" id="apf" accept=".jpg,.jpeg,.png" multiple>' +
    '<p><button class="pri" onclick="sendPhotos(' + fid + ',' + left + ')">Upload</button></p><div id="apm"></div>');
}
async function sendPhotos(fid, left) {
  try {
    const n = $('#apf').files.length;
    if (!n) throw new Error('Choose at least one photo');
    if (n > left) throw new Error('You can add only ' + left + ' more');
    await api('/api/flats/' + fid + '/photos', 'POST', {photos: await readPhotos($('#apf'))}); closeModal(); go('myflats');
  } catch (e) { msg('apm', e.message); }
}
async function rmPhoto(fid, name) { if (confirm('Remove this photo?')) { await api('/api/flats/' + fid + '/photos/remove', 'POST', {name: name}); go('myflats'); } }
async function editRent(id, cur) { const v = prompt('New price', cur); if (v) { try { await api('/api/flats/' + id, 'PUT', {rent: v}); } catch (e) { alert(e.message); } go('myflats'); } }
async function toggleActive(id, a) { await api('/api/flats/' + id, 'PUT', {active: a}); go('myflats'); }
async function delFlat(id) { if (confirm('Delete this flat?')) { await api('/api/flats/' + id, 'DELETE'); go('myflats'); } }

function reviewBtn(b) {
  return b.status === 'approved' && !b.reviewed ? '<button onclick="reviewForm(' + b.id + ')">Write review</button>' : '';
}
function reviewForm(bid) {
  showModal('<h3>Write a review</h3><label>Rating</label><select id="rr"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>' +
    '<label>Comment</label><textarea id="rb" rows="3" style="width:100%"></textarea><p><button class="pri" onclick="sendReview(' + bid + ')">Submit</button></p><div id="rvm"></div>');
}
async function sendReview(bid) {
  try { await api('/api/reviews', 'POST', {booking_id: bid, rating: val('rr'), body: val('rb')}); closeModal(); go(VIEW); } catch (e) { msg('rvm', e.message); }
}
VIEWS.requests = async () => {
  const rows = await api('/api/bookings/mine');
  $('#main').innerHTML = '<h3>Booking requests</h3><p class="mut">Read the tenant\'s reviews from earlier owners before you approve.</p>' + (rows.map(b =>
    '<div class="card"><div class="row"><b style="flex:1">' + esc(b.tenant_name) + ' \u2192 ' + esc(b.title) + '</b><span class="badge ' + (b.status === 'pending' ? 'warn' : b.status === 'approved' ? '' : 'bad') + '">' + b.status + '</span></div>' +
    '<div class="mut">' + (b.kind === 'short' ? esc(b.start_day) + ' to ' + esc(b.end_day) : 'Move-in ' + esc(b.start_day)) + (b.note ? ' \u00B7 "' + esc(b.note) + '"' : '') + '</div>' +
    '<p>Tenant rating: ' + stars(b.tenant_rating) + '</p>' + (b.status === 'approved' ? contactBox('Tenant', b.tenant_name, b.tenant_phone, b.tenant_email) : '') +
    (b.tenant_reviews.map(r => '<div class="sq"><b>\u2605 ' + r.rating + '</b> ' + esc(r.body) + '<div class="mut">by ' + esc(r.author) + '</div></div>').join('') || '<p class="mut">No reviews about this tenant yet.</p>') +
    '<div class="row">' + (b.status === 'pending' ? '<button class="pri" onclick="decide(' + b.id + ',\'approve\')">Approve</button><button class="red" onclick="decide(' + b.id + ',\'decline\')">Decline</button>' : '') + reviewBtn(b) + '</div></div>').join('') || '<p class="mut">No requests yet.</p>');
};
async function decide(id, action) { try { await api('/api/bookings/' + id + '/decide', 'POST', {action: action}); } catch (e) { alert(e.message); } go(VIEW); }

/* ---------- tenant ---------- */
VIEWS.mybookings = async () => {
  const rows = await api('/api/bookings/mine');
  $('#main').innerHTML = '<h3>My bookings and requests</h3>' + (rows.map(b => '<div class="card"><div class="row"><b style="flex:1">' + esc(b.title) + ', ' + esc(b.city) + '</b><span class="badge ' + (b.status === 'pending' ? 'warn' : b.status === 'approved' ? '' : 'bad') + '">' + b.status + '</span></div>' +
    '<div class="mut">Owner: ' + esc(b.owner_name) + ' \u00B7 ' + (b.kind === 'short' ? esc(b.start_day) + ' to ' + esc(b.end_day) : 'Move-in ' + esc(b.start_day)) + '</div>' +
    (b.status === 'approved' ? contactBox('Owner', b.owner_name, b.owner_phone, b.owner_email) : '<p class="mut">Owner contact details are shared once the request is approved.</p>') +
    '<div class="row" style="margin-top:6px"><button onclick="showReviews(' + b.owner_id + ')">Owner reviews</button>' +
    (['pending', 'approved'].includes(b.status) ? '<button class="red" onclick="decide(' + b.id + ',\'cancel\')">Cancel</button>' : '') + reviewBtn(b) + '</div></div>').join('') || '<p class="mut">No bookings yet. Browse flats and send a request.</p>');
};
const opt = (id, cur, list) => '<select id="' + id + '">' + list.map(x => '<option' + (cur === x ? ' selected' : '') + '>' + x + '</option>').join('') + '</select>';
VIEWS.squad = async () => {
  const p = await api('/api/prefs'), sq = await api('/api/squads/mine');
  let matches = [];
  if (p.city) { try { matches = await api('/api/squad/matches'); } catch (e) { matches = []; } }
  $('#main').innerHTML = '<div class="card"><h3>My budget and house rules</h3><div class="two"><div><label>City</label><input id="pc" value="' + esc(p.city || '') + '"></div>' +
    '<div><label>Budget per person per month (\u20B9)</label><input id="pb" type="number" value="' + esc(p.budget || '') + '"></div>' +
    '<div><label>Smoking</label>' + opt('ps', p.smoking, ['no', 'yes']) + '</div><div><label>Pets</label>' + opt('pp', p.pets, ['no', 'yes']) + '</div>' +
    '<div><label>Food</label>' + opt('pd', p.diet, ['veg', 'nonveg', 'any']) + '</div><div><label>Sleep schedule</label>' + opt('pz', p.sleep, ['early', 'late']) + '</div>' +
    '<div><label>Guests</label>' + opt('pg', p.guests, ['rare', 'often']) + '</div></div><p><button class="pri" onclick="savePrefs()">Save</button></p><div id="pm"></div></div>' +
    '<div class="card"><h3>Suggested flatmates</h3><p class="mut">Same city, budgets within 25% of each other, and at least 60% matching house rules.</p>' +
    (matches.map(m => '<label style="display:flex;gap:8px;align-items:center;color:inherit;font-size:15px"><input type="checkbox" class="mc" value="' + m.user_id + '"> <b>' + esc(m.name) + '</b> \u00B7 \u20B9' + m.budget + ' \u00B7 ' + m.score + '% match <span class="mut">' + Object.values(m.rules).join(', ') + '</span></label>').join('') || '<p class="mut">Save your preferences to see matches.</p>') +
    (matches.length ? '<div class="row" style="margin-top:8px"><input id="sqn" placeholder="Squad name"><button class="pri" onclick="makeSquad()">Invite selected to a squad</button></div><div id="qm"></div>' : '') + '</div>' +
    '<h3>My squads</h3>' + (sq.map(s => '<div class="card"><b>' + esc(s.name) + '</b> <span class="mut">' + esc(s.city) + '</span>' +
      s.members.map(m => '<div class="mut">' + esc(m.name) + ' \u00B7 ' + m.status + ' \u00B7 \u20B9' + (m.budget || '?') + '</div>').join('') +
      '<div class="row" style="margin-top:6px">' + (s.my_status === 'invited' ? '<button class="pri" onclick="respond(' + s.id + ',true)">Accept</button><button class="red" onclick="respond(' + s.id + ',false)">Decline</button>' : '') +
      '<button onclick="squadFlats(' + s.id + ')">Matching flats</button></div></div>').join('') || '<p class="mut">No squads yet.</p>');
};
async function savePrefs() {
  try { await api('/api/prefs', 'POST', {city: val('pc'), budget: val('pb'), smoking: val('ps'), pets: val('pp'), diet: val('pd'), sleep: val('pz'), guests: val('pg')}); go('squad'); } catch (e) { msg('pm', e.message); }
}
async function makeSquad() {
  const ids = [...document.querySelectorAll('.mc:checked')].map(x => x.value);
  try { await api('/api/squads', 'POST', {name: val('sqn'), member_ids: ids}); go('squad'); } catch (e) { msg('qm', e.message); }
}
async function respond(id, accept) { await api('/api/squads/' + id + '/respond', 'POST', {accept: accept}); go('squad'); }
async function squadFlats(id) {
  try {
    const r = await api('/api/squads/' + id + '/flats');
    showModal('<h3>Flats for ' + r.size + ' flatmates</h3><p class="mut">Multi-bedroom flats with at least ' + r.size + ' bedrooms where the share per person fits the lowest budget (\u20B9' + r.lowest_budget + ').</p>' +
      (r.flats.map(f => '<div class="sq">' + photoStrip(f).replace('margin:-14px -14px 10px', 'margin:0 0 6px') + '<b>' + esc(f.title) + '</b><div class="mut">' + esc(f.area) + ' \u00B7 ' + f.bedrooms + ' BHK \u00B7 \u20B9' + f.rent + ' total</div><b>\u20B9' + f.per_person + ' per person</b></div>').join('') || '<p>No matching flats yet.</p>'));
  } catch (e) { showModal('<p class="err">' + esc(e.message) + '</p>'); }
}

(async () => { await refreshMe(); go('browse'); })();
</script>
</body>
</html>
